name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Node runs the NEXUS server's tests, and the Python tests that push to it.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      # FFmpeg runs corthex-uxui's media check on made-up clips; without it those tests are skipped.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - run: python -m unittest discover -s tests -v
      - run: node --test nexus/test/*.test.js

  hub-compatibility:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Python 3.8 has an Intel macOS build, not an arm64 one.
        os: [ubuntu-24.04, windows-latest, macos-15-intel]
        python: ["3.8", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
          check-latest: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Verify the local hub and every command boundary
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -p "test_hub*.py" -v

  claude-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code@2.1.309
      - run: claude plugin validate --strict .
      - run: claude plugin validate --strict plugins/corthex
      - run: claude plugin validate --strict plugins/corthex-memory
      - run: claude plugin validate --strict plugins/corthex-nexus

  nexus-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: nexus
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npx wrangler deploy --dry-run --outdir dist

  nexus-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      # Contract tools live outside the checkout, never in plugin/server runtime dependencies.
      - name: Install pinned external contract tools
        run: |
          python -m venv "$RUNNER_TEMP/nexus-contract-env"
          "$RUNNER_TEMP/nexus-contract-env/bin/python" -m pip install schemathesis==3.39.16 openapi-spec-validator==0.7.1 PyYAML==6.0.3 jsonschema==4.26.0 hypothesis==6.170.14 hypothesis-jsonschema==0.23.2 requests==2.34.2
      - name: Validate the OpenAPI contract
        run: '"$RUNNER_TEMP/nexus-contract-env/bin/python" -m openapi_spec_validator docs/06-api/nexus.openapi.yaml'
      - name: Validate offline actual-handler response schemas
        run: '"$RUNNER_TEMP/nexus-contract-env/bin/python" nexus/test/contract_response_check.py'
      - name: Validate every named default response and common headers
        run: '"$RUNNER_TEMP/nexus-contract-env/bin/python" nexus/test/default_response_check.py'
      - name: Validate hub snapshots, records and picture schemas
        run: '"$RUNNER_TEMP/nexus-contract-env/bin/python" nexus/test/hub_contract_check.py'
      - name: Verify offline redirect, sanitizer and schema controls
        env:
          HYPOTHESIS_STORAGE_DIRECTORY: ${{ runner.temp }}/nexus-contract-cache
        run: '"$RUNNER_TEMP/nexus-contract-env/bin/python" nexus/test/contract_hooks_check.py'
      - name: Verify redaction in failing parallel diagnostics
        env:
          HYPOTHESIS_STORAGE_DIRECTORY: ${{ runner.temp }}/nexus-contract-cache
        run: '"$RUNNER_TEMP/nexus-contract-env/bin/python" nexus/test/contract_sanitizer_check.py'

  all-checks:
    if: ${{ always() }}
    needs: [tests, hub-compatibility, claude-validate, nexus-build, nexus-contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
