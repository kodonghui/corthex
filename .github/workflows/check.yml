name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Node runs the NEXUS server's tests, and the Python tests that push to it.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # FFmpeg runs corthex-uxui's media check on made-up clips; without it those tests are skipped.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - run: python -m unittest discover -s tests -v
      - run: node --test nexus/test/*.test.js

  claude-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code@2.1.309
      - run: claude plugin validate --strict .
      - run: claude plugin validate --strict plugins/corthex
      - run: claude plugin validate --strict plugins/corthex-memory
      - run: claude plugin validate --strict plugins/corthex-nexus

  nexus-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx wrangler deploy --dry-run --outdir dist
