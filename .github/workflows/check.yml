name: check

# A draft pull request runs only the Linux jobs, so that each push gets its results
# sooner, and its last job reports as linux-checks. Every other run, of a pull request
# that is ready for review, a push to main or a run started by hand, covers Linux,
# Windows and macOS, and only such a run reports all-checks, the check that main
# requires. A draft cannot be merged, and marking it ready for review starts that run.
# Each `github.event.pull_request.draft` below makes this choice.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    # Each lane runs as three jobs that take every third test (.github/test-shard.py):
    # the whole suite had reached the hour limit on the Python 3.8 Windows lane, and
    # halves of it came within ten minutes of it on slow Windows and Intel macOS runners.
    name: tests (${{ matrix.os }}, ${{ matrix.python }}, share ${{ matrix.share }} of 3)
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event.pull_request.draft && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest", "macos-15-intel", "macos-latest"]') }}
        python: ["3.8", "3.15"]
        share: [1, 2, 3]
        exclude:
          # The older x64 build runs natively; keep the newest on Apple Silicon.
          - {os: macos-15-intel, python: "3.15"}
          - {os: macos-latest, python: "3.8"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      # Node also checks the dependency-free browser helper.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      # FFmpeg runs corthex-uxui's media check on made-up clips; without it those tests are skipped.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - run: python .github/test-shard.py ${{ matrix.share }}/3

  hub-compatibility:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Python 3.8 has an Intel macOS build, not an arm64 one.
        os: ${{ fromJSON(github.event.pull_request.draft && '["ubuntu-24.04"]' || '["ubuntu-24.04", "windows-latest", "macos-15-intel"]') }}
        python: ["3.8", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
          check-latest: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      # Discovery includes test_hub_cli_outcomes.py: one method per TASK-250 TC,
      # with isolated homes and loopback-only HTTP, never service credentials.
      - name: Verify the local hub and every command boundary, including CLI outcomes
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -p "test_hub*.py" -v

  claude-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code@2.1.309
      - run: claude plugin validate --strict .
      - run: claude plugin validate --strict plugins/corthex
      - run: claude plugin validate --strict plugins/corthex-memory
      - run: claude plugin validate --strict plugins/corthex-nexus

  memory-hooks:
    uses: ./.github/workflows/memory-hook-check.yml
    with:
      linux-only: ${{ github.event.pull_request.draft == true }}

  windows-hooks:
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/windows-hook-check.yml

  all-checks:
    # A skipped required check counts as passed, so a draft's run reports this job
    # under another name instead of skipping it.
    name: ${{ github.event.pull_request.draft && 'linux-checks' || 'all-checks' }}
    if: ${{ always() }}
    needs: [tests, hub-compatibility, claude-validate, memory-hooks, windows-hooks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only a draft's run skips a job, windows-hooks.
      - name: Fail unless every job succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || (contains(needs.*.result, 'skipped') && !github.event.pull_request.draft) }}
        run: exit 1
