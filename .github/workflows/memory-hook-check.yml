name: memory-hook-check

# Reused by check so all-checks also waits for the installed Unix hosts.
# Only synthetic homes, fake credentials and the loopback model are used.
on:
  workflow_call:
    inputs:
      linux-only:
        description: Run on Linux only, as check does for a draft pull request.
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hook:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.linux-only && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0 # TC-107 installs the immutable historical 0.1.0 package.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.15"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install isolated-run host executables
        run: npm install -g @anthropic-ai/claude-code@2.1.310 @openai/codex@0.164.0
      - name: Four hooks in both installed hosts
        run: python .github/hook-check/run.py native "${{ runner.temp }}/memory-hook-check" claude,codex
      - name: Actual native tool inputs, outputs and transcript exclusion
        if: ${{ !cancelled() }}
        run: python .github/hook-check/tool_turn.py "${{ runner.temp }}/memory-hook-check/tool-turn"
      - name: C1 agent-flow state replays in installed hosts (loopback replies)
        if: ${{ !cancelled() }}
        run: python .github/hook-check/walk_replay.py "${{ runner.temp }}/memory-hook-check/walk-replay"
      - name: Actual startup, resume, clear, compact and fork
        if: ${{ !cancelled() }}
        run: python .github/hook-check/lifecycle.py "${{ runner.temp }}/memory-hook-check/lifecycle"
      - name: Actual native background-agent notification
        if: ${{ !cancelled() }}
        run: python .github/hook-check/native_prefix.py "${{ runner.temp }}/memory-hook-check/native-prefix"
      - name: Actual own-parent agent message and completion
        if: ${{ !cancelled() }}
        run: python .github/hook-check/native_prefix.py "${{ runner.temp }}/memory-hook-check/agent-message" --kind agent
      - name: Actual cross-session message between owned fixtures
        if: ${{ !cancelled() }}
        run: python .github/hook-check/cross_session.py "${{ runner.temp }}/memory-hook-check/cross-session"
      - name: Codex 0.1.0 trust, update and native retrust UI
        if: ${{ !cancelled() }}
        run: python .github/hook-check/trust_update.py "${{ runner.temp }}/memory-hook-check/trust-update"
      - name: Outer clocks, worker lifetime, preservation and 100-sample timings
        if: ${{ !cancelled() }}
        run: python .github/hook-check/run.py evidence "${{ runner.temp }}/memory-hook-check" claude,codex --evidence --benchmark100
      - name: Redaction benchmark for the 512 KiB synthetic input
        if: ${{ !cancelled() }}
        run: python tests/bench_memory_redaction.py --samples 10
      - name: Bubblewrap for Claude Code's subprocess scrub (TC-257)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: |
          if ! command -v bwrap >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap
          fi
          # Ubuntu 24.04 keeps unprivileged user namespaces from bubblewrap unless this is off.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: C2 at 0.3.0 in both installed hosts against local servers (TC-253 to TC-255, TC-257)
        if: ${{ !cancelled() }}
        run: python .github/hook-check/c2_hosts.py "${{ runner.temp }}/memory-hook-check"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: memory-hooks-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/memory-hook-check
            !${{ runner.temp }}/memory-hook-check/**/codex-home/tmp/arg0-*/**
            !${{ runner.temp }}/memory-hook-check/c2-hosts/source/**
          retention-days: 7

  # TC-256 runs the staged prompt hook 600 times; its own job keeps the hook job within its time.
  # The self-tests of the real-provider check (TASK-100) and of the measurement check (TASK-047) run here too,
  # since they need Python only; they call no provider.
  recall-timing:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.linux-only && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.15"
      - name: The prompt hook's time with 1,000, 5,000 and 20,000 items (TC-256)
        run: python .github/hook-check/c2_recall_timing.py "${{ runner.temp }}/recall-timing"
      - name: The real-provider check against its own local server, no provider (TASK-100 self-test)
        if: ${{ !cancelled() }}
        run: python .github/hook-check/c2_real.py "${{ runner.temp }}/real-self-test" --self-test
      - name: The measurement check against its own local server, no provider (TASK-047 self-test)
        if: ${{ !cancelled() }}
        run: python .github/hook-check/c2_measure.py "${{ runner.temp }}/measure-self-test" --self-test --part efforts --part skip --part recall
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: memory-recall-timing-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/recall-timing/c2-recall-timing/report.json
            ${{ runner.temp }}/real-self-test/c2-real/report.json
            ${{ runner.temp }}/measure-self-test/c2-measure/report.json
          retention-days: 7

  # TASK-101's replays of the C2 walks with a scripted curator, in their own job for time.
  walk-replay:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.linux-only && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.15"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install isolated-run host executables
        run: npm install -g @anthropic-ai/claude-code@2.1.310 @openai/codex@0.164.0
      - name: C2 walk replays in both installed hosts, scripted curator (TC-263 to TC-269, TC-357, TC-374 to TC-377)
        run: python .github/hook-check/c2_walk_replay.py "${{ runner.temp }}/walk-replay"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: memory-walk-replay-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/walk-replay/c2-walk-replay/report.json
            ${{ runner.temp }}/walk-replay/c2-walk-replay/*/output-*.txt
            ${{ runner.temp }}/walk-replay/c2-walk-replay/inputs/**
          retention-days: 7
