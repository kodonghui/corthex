name: windows-hook-check

# Runs the corthex-memory session start hook in Claude Code and Codex on Windows,
# with Git Bash, without it, and with only Windows PowerShell 5.1. Both hosts talk
# to a mock model server on 127.0.0.1 with fake keys, so no model is called.
# A step fails when a host it names got no memory context. Claude Code needs Git
# Bash or PowerShell 7, so the last step expects only Codex. The report is in the
# log, the job summary and the hook-check artifact.

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: windows-hook-check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  hook:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install Claude Code and Codex
        shell: cmd
        run: call npm install -g @anthropic-ai/claude-code@2.1.310 @openai/codex@0.164.0
      - name: With Git Bash
        shell: cmd
        run: python .github\hook-check\run.py git-bash "%RUNNER_TEMP%\hook-check" claude,codex
      - name: Without Git Bash
        if: ${{ !cancelled() }}
        shell: cmd
        run: |
          ren "C:\Program Files\Git" Git.hidden || exit /b 1
          python .github\hook-check\run.py no-git-bash "%RUNNER_TEMP%\hook-check" claude,codex
      - name: With only Windows PowerShell 5.1
        if: ${{ !cancelled() }}
        shell: cmd
        run: |
          ren "C:\Program Files\PowerShell\7" 7.hidden || exit /b 1
          python .github\hook-check\run.py powershell-5.1-only "%RUNNER_TEMP%\hook-check" codex
      - name: Restore Git and PowerShell 7
        if: always()
        shell: cmd
        run: |
          if exist "C:\Program Files\Git.hidden" ren "C:\Program Files\Git.hidden" Git
          if exist "C:\Program Files\PowerShell\7.hidden" ren "C:\Program Files\PowerShell\7.hidden" 7
          exit /b 0
      - name: Actual native tool inputs, outputs and transcript exclusion
        if: ${{ !cancelled() }}
        shell: cmd
        run: python .github\hook-check\tool_turn.py "%RUNNER_TEMP%\hook-check\tool-turn"
      - name: Actual headless lifecycle sources; terminal sources have operator evidence
        if: ${{ !cancelled() }}
        shell: cmd
        run: python .github\hook-check\lifecycle.py "%RUNNER_TEMP%\hook-check\lifecycle"
      - name: Actual native background-agent notification
        if: ${{ !cancelled() }}
        shell: cmd
        run: python .github\hook-check\native_prefix.py "%RUNNER_TEMP%\hook-check\native-prefix"
      - name: Actual own-parent agent message and completion
        if: ${{ !cancelled() }}
        shell: cmd
        run: python .github\hook-check\native_prefix.py "%RUNNER_TEMP%\hook-check\agent-message" --kind agent
      - name: Actual cross-session message between owned fixtures
        if: ${{ !cancelled() }}
        shell: cmd
        run: python .github\hook-check\cross_session.py "%RUNNER_TEMP%\hook-check\cross-session"
      - name: Outer clocks, worker lifetime, preservation and 100-sample timings
        if: ${{ !cancelled() }}
        shell: cmd
        run: python .github\hook-check\run.py evidence "%RUNNER_TEMP%\hook-check" claude,codex --evidence --benchmark100
      - name: Redaction benchmark for the 512 KiB synthetic input
        if: ${{ !cancelled() }}
        shell: cmd
        run: python tests/bench_memory_redaction.py --samples 10
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: hook-check
          path: |
            ${{ runner.temp }}/hook-check
            !${{ runner.temp }}/hook-check/**/codex-home/tmp/arg0-*/**
          retention-days: 7
